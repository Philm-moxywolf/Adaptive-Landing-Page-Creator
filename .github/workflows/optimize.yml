name: Weekly conversion optimizer

# Every Saturday the optimizer pulls GA4, re-researches the market, rewrites the
# page for conversion, and opens a PR. Vercel builds a preview of that PR so the
# change can be reviewed before it goes live. Manual runs are available too.
on:
  schedule:
    - cron: "0 9 * * 6" # Saturdays, 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run analysis + rewrite without committing a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the weekly optimizer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          OPTIMIZER_MODEL: ${{ vars.OPTIMIZER_MODEL }}
          # PostHog (optional) — behavioural signal
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          # Google Search Console (optional) — free SEO signal (reuses GA4 service account)
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
        run: npm run optimize ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '-- --dry-run' || '' }}

      - name: Upload optimizer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-report
          path: optimizer/reports/*.json
          if-no-files-found: ignore

      - name: Open pull request with the rewrite
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: optimizer/weekly-${{ github.run_id }}
          commit-message: "chore(optimizer): weekly conversion rewrite"
          title: "🤖 Weekly conversion optimization"
          body: |
            Automated weekly landing-page optimization.

            **This PR was generated by the optimizer.** It read the last 7 days of GA4
            data, re-researched the market, and rewrote `content/landing.json` to push
            every conversion target past its stretch goal.

            **Before merging:**
            1. Open the **Vercel preview** for this PR and review the page.
            2. Read the rationale + changelog in the **optimizer-report** workflow artifact.
            3. Confirm copy is on-brand and every claim is truthful.

            Merge to ship. Close to discard this week's rewrite.
          labels: |
            optimizer
            automated
          add-paths: |
            content/landing.json
